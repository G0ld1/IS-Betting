services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: betstrike-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: betstrike-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  kafka:
    image: apache/kafka:3.7.0
    container_name: betstrike-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:9092"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: betstrike-kafka-ui
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: betstrike
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: betstrike-db-init
    depends_on:
      - sqlserver
    volumes:
      - ./:/work
    entrypoint: ["/bin/bash", "/work/scripts/init-sqlserver.sh"]
    environment:
      ACCEPT_EULA: "Y"
      SQLCMDPASSWORD: "Str0ng!Passw0rd2026"

  betting-api:
    build:
      context: .
      dockerfile: src/BetStrike.Betting.Api/Dockerfile
    container_name: betstrike-betting-api
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ApostasDb: Server=sqlserver,1433;Database=Apostas;User Id=sa;Password=Str0ng!Passw0rd2026;TrustServerCertificate=True;Encrypt=False
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      RabbitMq__VirtualHost: /
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "5002:8080"

  results-api:
    build:
      context: .
      dockerfile: src/Federation.Results.Api/Dockerfile
    container_name: betstrike-results-api
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ResultsDb: Server=sqlserver,1433;Database=ResultadosFutebol;User Id=sa;Password=Str0ng!Passw0rd2026;TrustServerCertificate=True;Encrypt=False
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      RabbitMq__VirtualHost: /
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "5001:8080"

  middleware-worker:
    build:
      context: .
      dockerfile: src/BetStrike.Middleware.Worker/Dockerfile
    container_name: betstrike-middleware-worker
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    environment:
      ConnectionStrings__AnalyticsDb: Server=sqlserver,1433;Database=Apostas;User Id=sa;Password=Str0ng!Passw0rd2026;TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__ApostasDb: Server=sqlserver,1433;Database=Apostas;User Id=sa;Password=Str0ng!Passw0rd2026;TrustServerCertificate=True;Encrypt=False
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      RabbitMq__VirtualHost: /

  streaming-worker:
    build:
      context: .
      dockerfile: src/BetStrike.Streaming.Worker/Dockerfile
    container_name: betstrike-streaming-worker
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment:
      ConnectionStrings__AnalyticsDb: Server=sqlserver,1433;Database=Apostas;User Id=sa;Password=Str0ng!Passw0rd2026;TrustServerCertificate=True;Encrypt=False
      ConnectionStrings__ApostasDb: Server=sqlserver,1433;Database=Apostas;User Id=sa;Password=Str0ng!Passw0rd2026;TrustServerCertificate=True;Encrypt=False
      Kafka__BootstrapServers: kafka:9092
      Kafka__GroupId: betstrike-streaming-analytics
      Kafka__Topics__0: bets-events
      Kafka__Topics__1: game-events
      Kafka__Topics__2: analytics-events

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: betstrike-frontend
    depends_on:
      betting-api:
        condition: service_started
      results-api:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  sqlserver-data:
